# Lesson 3 building block. Run from the root of your individual exercise repo.
# Local hooks reuse the exact Ruff version and settings already locked in uv.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff check
        entry: uv run --locked ruff check
        language: system
        types: [python]
      - id: ruff-format-check
        name: Ruff format check
        entry: uv run --locked ruff format --check
        language: system
        types: [python]
